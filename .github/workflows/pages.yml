name: Publish GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FANTACALCIO_USERNAME: ${{ secrets.FANTACALCIO_USERNAME }}
      FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: ${{ env.FANTACALCIO_USERNAME != '' && env.FANTACALCIO_PASSWORD != '' }}
      - run: npm run sync:results
        if: ${{ env.FANTACALCIO_USERNAME != '' && env.FANTACALCIO_PASSWORD != '' }}
        env:
          FANTACALCIO_USERNAME: ${{ secrets.FANTACALCIO_USERNAME }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
          FANTACALCIO_LEAGUE_ALIAS: fantacalcio-da-sikinenz
          FANTACALCIO_COMPETITION_ID: '629232'
      - run: npm run build:pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
